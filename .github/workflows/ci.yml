name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev, kiger-dev]
  pull_request:
    branches: [main, dev, kiger-dev]

# 同一分支上新推送取消尚未完成的旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kigercrm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kigercrm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      KIGER_TEST_POSTGRES_CONNECTION_STRING: "Host=localhost;Port=5432;Database=kigercrm_test;Username=postgres;Password=postgres;Pooling=false"
    steps:
      - uses: actions/checkout@v7

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/props/*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # 走 NuGet 包模式：解决方案名不以 XiHanFun 开头，props/framework.props 判定为包引用
      - name: 还原
        run: dotnet restore backend/XiHan.BasicApp.slnx

      - name: 构建
        run: dotnet build backend/XiHan.BasicApp.slnx -c Release --no-restore

      # MTP 模式（见仓库根 global.json 的 test.runner）：解决方案须由 --solution 传入，
      # VSTest 的 --logger 不再受理，trx 改由 MTP 的 --report-trx 产出（置于 -- 之后转发给测试应用）
      - name: 测试
        run: dotnet test --solution backend/XiHan.BasicApp.slnx -c Release --no-build -- --report-trx

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  frontend:
    name: 前端类型检查与静态检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # action 在仓库根目录执行，默认只找根 package.json；本仓库的清单在 frontend/ 下，
      # 故显式指路，版本仍取自它的 packageManager 字段，不在此处再写一份版本号。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      # 仓库尚无 pnpm-lock.yaml，因此不启用依赖缓存，避免把清单误作锁文件。
      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      # 当前仓库没有提交 pnpm-lock.yaml；setup-node 的 pnpm 缓存必须基于锁文件，
      # 不能用 workspace/package 清单冒充锁文件。待纳入锁文件后再启用依赖缓存。

      # 无锁文件可冻结，装的是 catalog 里 ^ 范围内的最新解析结果
      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 类型检查
        run: pnpm run type-check

      - name: 单元测试
        run: pnpm run test

      - name: 生产构建
        run: pnpm run build

      - name: 静态检查
        run: pnpm run lint

      - name: 裸 px 门禁
        run: pnpm run px:check

      - name: 文案与模块门禁
        run: pnpm run validate
